name: Generate v2.0.0 analytical figures

on:
  workflow_dispatch:
  push:
    branches:
      - update-v2.0.0-reproducibility
    paths:
      - '.github/workflows/generate-figures-v2.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: update-v2.0.0-reproducibility
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate verified outputs
        env:
          MPLBACKEND: Agg
        run: |
          rm -rf figures
          python reproducibility_analysis.py > reproducibility_analysis_results.txt

      - name: Validate generated files
        run: |
          set -euo pipefail
          test -s figures/figure_index_boxplots.png
          test -s figures/figure_spearman_correlations.png
          test -s figures/figure_gender_differences.png
          test -s figures/figure_clustering_elbow.png
          test -s figures/figure_clustering_pca.png
          test -s figures/figure_word_cloud.png
          test -s figures/table_characteristic_terms_by_category.csv
          python -m py_compile reproducibility_analysis.py

      - name: Commit final figures
        run: |
          set -euo pipefail
          rm -rf .figures_payload __pycache__
          rm -f .github/workflows/generate-figures-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add verified analytical figures for v2.0.0'
          git push origin update-v2.0.0-reproducibility
