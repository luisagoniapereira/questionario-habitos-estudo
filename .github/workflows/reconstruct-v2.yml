name: Reconstruct v2.0.0 files

on:
  push:
    branches:
      - update-v2.0.0-reproducibility
    paths:
      - '.release_parts/**'
      - '.github/workflows/reconstruct-v2.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: update-v2.0.0-reproducibility
          fetch-depth: 0

      - name: Reconstruct final text files
        shell: bash
        run: |
          set -euo pipefail
          cat .release_parts/text_payload.part* > /tmp/text_payload.b64
          base64 --decode /tmp/text_payload.b64 > /tmp/text_payload.tar.gz
          tar -xzf /tmp/text_payload.tar.gz -C .
          rm -rf .release_parts
          rm -f README_PT.md reproducao_analise.py

      - name: Validate repository content
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f Reproducibility_Analysis_Report.md
          test -f reproducibility_analysis.py
          test -f reproducibility_analysis_results.txt
          test -f requirements.txt
          ! grep -RniE 'ChatGPT|OpenAI|artificial intelligence|CHANGELOG|CANGELOG|camera[_ -]?ready' \
              README.md Reproducibility_Analysis_Report.md reproducibility_analysis.py \
              reproducibility_analysis_results.txt requirements.txt
          python -m py_compile reproducibility_analysis.py

      - name: Commit reconstructed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Complete v2.0.0 reproducibility package'
            git push origin update-v2.0.0-reproducibility
          fi
